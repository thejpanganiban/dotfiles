## --  PLUGINS
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save sessions/layouts every 5 minutes and restore on tmux server start.
set -g @continuum-save-interval '5'
set -g @continuum-restore 'on'

# Solarized-ish status and UI colors
set -g status-style "bg=colour235,fg=colour136"
set -g window-status-style "fg=colour244,bg=default"
set -g window-status-current-style "fg=colour166,bg=default"
set -g pane-border-style "fg=colour235"
set -g pane-active-border-style "fg=colour240"
set -g message-style "bg=colour235,fg=colour166"
set -g display-panes-active-colour colour33
set -g display-panes-colour colour166
set -g clock-mode-colour green
set -g status-left-length 40

# Active folder, Git branch, clock, system uptime, and autosave interval.
# Keep this before TPM so continuum can add its autosave hook.
set -g status-right-length 100
set -g status-interval 5
set -g status-right '#[fg=colour244]#{b:pane_current_path} · #[fg=colour166]#(sh "$HOME/.tmux/scripts/status-git.sh" #{q:pane_current_path})#[fg=colour136]%H:%M #[fg=colour244]· #(sh "$HOME/.tmux/scripts/status-uptime.sh") · save:#{continuum_status}m'

# Faster escape handling
set -s escape-time 0

# Activity monitoring
setw -g monitor-activity on

# Mouse Support
set -g mouse on

# Extended Keys Support
set -g extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -g extended-keys-format csi-u

## -- KEYBINDINGS

# Keep new windows and splits in the active pane's working directory.
# Explicitly-created sessions start at the filesystem root.
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind C-s new-session -c /

# Toggle between the home session and the previously active session.
bind Enter if-shell -F '#{==:#{session_name},system}' 'switch-client -l' 'switch-client -t =system'

# Pane movement
bind h select-pane -L
bind j select-pane -D
# Fuzzy session switcher (pane-up remains available on prefix + Up).
bind k display-popup -E -w 70% -h 60% 'sh "$HOME/.tmux/scripts/session-picker.sh" "#{client_name}"'
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded..."

# Allow escape sequences to pass through to iTerm2
set -g allow-passthrough on
set -g bell-action any
set -g monitor-bell on
set -g focus-events on

# Initialize TMUX plugin manager (Keep this at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
